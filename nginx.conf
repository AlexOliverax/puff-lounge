server {
    listen 80;
    server_name pufflounge.app.br www.pufflounge.app.br _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml image/svg+xml;

    # Assets com hash gerados pelo Expo (_expo/static) podem ter cache longo
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Manifest e HTML sempre atualizados para o PWA receber updates na hora
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA para rotas do Expo Router (/venue/[id], /brand/[id], abas)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

