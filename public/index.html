<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!-- Tema & Cor da Barra de Status (Android Chrome, iOS Safari, Desktop PWA) -->
    <meta name="theme-color" content="#0F0E0E" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Guia de luxo para apreciadores de charutos: lounges, tabacarias, confrarias, marcas, harmonizações e umidor virtual."
    />

    <!-- PWA & iOS Home Screen Web App (pufflounge.app.br) -->
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Puff & Lounge" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="stylesheet" href="/leaflet.css" />

    <!-- Captura o prompt de instalação do Android antes do app carregar e registra o Service Worker -->
    <script>
      window.__plInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__plInstallPrompt = e;
        window.dispatchEvent(new Event('pl-install-available'));
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js?v=3')
            .then(function (reg) {
              if (reg && reg.update) reg.update();
            })
            .catch(function () {});
        });
      }
    </script>

    <!-- Open Graph / Compartilhamento no WhatsApp, iMessage, Instagram e Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Puff & Lounge" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://pufflounge.app.br/" />
    <meta property="og:title" content="Puff & Lounge — Guia de Charutos & Lounges" />
    <meta
      property="og:description"
      content="Descubra cigar lounges, tabacarias e confrarias na sua região, enciclopédia de marcas, guia de harmonização e umidor pessoal."
    />
    <meta property="og:image" content="https://pufflounge.app.br/icon-512.png?v=3" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Puff & Lounge — Guia de Charutos & Lounges" />
    <meta
      name="twitter:description"
      content="Descubra cigar lounges, tabacarias e confrarias na sua região, enciclopédia de marcas, guia de harmonização e umidor pessoal."
    />
    <meta name="twitter:image" content="https://pufflounge.app.br/icon-512.png?v=3" />

    <!-- Reset e acabamento visual de luxo (Safe Areas iOS, Scrollbars Douradas, Anti-aliasing) -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0F0E0E;
        color: #F5F2EB;
        -webkit-tap-highlight-color: transparent;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
        user-select: none;
      }
      input,
      textarea {
        user-select: text;
        outline: none;
      }
      body {
        overflow: hidden;
        padding-top: env(safe-area-inset-top, 0px);
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Scrollbars discretas em ouro envelhecido no desktop */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0F0E0E;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.28);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 175, 55, 0.55);
      }
    </style>
  </head>

  <body>
    <noscript>Você precisa habilitar o JavaScript para abrir o Puff &amp; Lounge.</noscript>
    <div id="root"></div>
  </body>
</html>
